name: ClinicFlow CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "screenshots/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.76.0

jobs:
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run pytest
        working-directory: backend
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: backend/pytest-report.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  build-scan-push:
    name: Build, scan & push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/clinicflow-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Build image (tagged with commit SHA)
        run: docker build --pull -t "${{ steps.meta.outputs.image }}:${{ github.sha }}" ./${{ matrix.service }}

      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "${{ steps.meta.outputs.image }}:${{ github.sha }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}:${{ github.sha }}"

  deploy:
    name: Deploy (GitOps image bump)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Argo CD watches helm/clinicflow on main; changing the tags here rolls out the new images.
      - name: Point Helm values at the new images
        run: |
          sed -i -E "s|^(  tag: ).*$|\1\"${GITHUB_SHA}\"|" helm/clinicflow/values.yaml
          grep -n 'tag:' helm/clinicflow/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/clinicflow/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: images ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      # Optional direct deploy (e.g. EKS): set KUBE_CONFIG_DATA as a repo secret to enable.
      - name: Helm deploy to cluster
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          mkdir -p ~/.kube && echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          helm upgrade --install clinicflow ./helm/clinicflow -n clinicflow --create-namespace --wait --timeout 5m
