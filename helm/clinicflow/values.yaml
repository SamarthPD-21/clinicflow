# Image tags are rewritten by CI (deploy job) to the commit SHA that was built and scanned.
backend:
  image: ghcr.io/samarthpd-21/clinicflow-backend
  tag: "e3b8122519589b70c937c95e5c4de17675b02a0a"
  replicas: 2
  port: 8000
  clinicTimezone: Asia/Kolkata
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }

frontend:
  image: ghcr.io/samarthpd-21/clinicflow-frontend
  tag: "e3b8122519589b70c937c95e5c4de17675b02a0a"
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

imagePullPolicy: IfNotPresent
imagePullSecrets: []

postgres:
  image: postgres:16-alpine
  database: clinicflow
  username: clinicflow
  # Empty = generate a random password on first install and keep it on upgrades.
  # Or set it explicitly / point existingSecret at a Secret with username+password keys.
  password: ""
  existingSecret: ""
  storage: 2Gi
  storageClass: ""

ingress:
  enabled: true
  className: nginx
  host: clinicflow.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: true
    # Must match the kube-prometheus-stack release name so Prometheus selects it.
    releaseLabel: kube-prometheus-stack
  grafanaDashboard:
    enabled: true
