{{- if not .Values.postgres.existingSecret }}
{{- /* Reuse the password from a previous install: Postgres only reads it when the volume is first initialised. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "clinicflow.dbSecret" .) }}
{{- $password := .Values.postgres.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinicflow.dbSecret" . }}
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ $password | default (randAlphaNum 24) | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: clinicflow-postgres
    {{- include "clinicflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: clinicflow-postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: clinicflow-postgres
    {{- include "clinicflow.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: { app: clinicflow-postgres }
  template:
    metadata:
      labels:
        app: clinicflow-postgres
        {{- include "clinicflow.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "clinicflow.dbSecret" . }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "clinicflow.dbSecret" . }}, key: password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
