{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "clinicflow.labels" . | nindent 4 }}
data:
  clinicflow.json: |-
{{ .Files.Get "dashboards/clinicflow.json" | indent 4 }}
{{- end }}
